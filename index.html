<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cohort: e-learning platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --base: #0e1719;
        --surface: #172123;
        --surface-2: #1f2c2e;
        --text: #e9f1ef;
        --text-2: #93a5a3;
        --line: rgba(233, 241, 239, 0.11);
        --green: #3ddc97; /* action, and on pace */
        --green-soft: rgba(61, 220, 151, 0.13);
        --amber: #f2b33d; /* behind pace, needs attention */
        --page: #f7f3ea; /* reading view */
        --page-ink: #1b1a17;

        --r-sm: 10px;
        --r-md: 16px;
        --r-lg: 22px;
        --r-full: 999px;
        --f-ui: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif;
        --f-read: "Literata", Georgia, serif;
        --desk: #080d0e;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--desk);
        color: var(--text);
        font-family: var(--f-ui);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-align: left;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        font-family: var(--f-ui);
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.025em;
      }
      :focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* Page shell */
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: clamp(24px, 5vw, 56px) clamp(16px, 4vw, 40px) 80px;
        display: grid;
        grid-template-columns: 390px 1fr;
        gap: clamp(32px, 5vw, 64px);
        align-items: start;
        color: var(--text);
      }
      .doc .kicker {
        color: #6fd9ae;
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      .doc h1 {
        font-size: clamp(32px, 4vw, 46px);
        margin-bottom: 12px;
      }
      .doc h2 {
        font-size: 20px;
        font-weight: 700;
        margin: 34px 0 12px;
      }
      .doc p {
        color: var(--text-2);
        line-height: 1.6;
        max-width: 62ch;
        margin: 0 0 14px;
        font-size: 15px;
      }
      .doc strong {
        color: var(--text);
      }
      .doc ul {
        margin: 0 0 14px;
        padding-left: 18px;
        color: var(--text-2);
        font-size: 15px;
        line-height: 1.6;
      }
      .doc li {
        margin-bottom: 6px;
      }
      .flow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }
      .node {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .node.entry {
        border-color: var(--green);
        color: var(--green);
      }
      .arrow {
        color: #6e807e;
        font-size: 13px;
      }
      .tok {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
        gap: 8px;
        margin-bottom: 18px;
      }
      .sw {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        font-size: 12px;
        line-height: 1.4;
      }
      .sw i {
        display: block;
        height: 24px;
        border-radius: 4px;
        margin-bottom: 8px;
      }
      .sw span {
        color: var(--text-2);
      }

      /* Phone */
      .phone {
        position: sticky;
        top: 32px;
        width: 390px;
        height: 800px;
        background: var(--base);
        border-radius: 38px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.7);
      }
      .status {
        display: flex;
        justify-content: space-between;
        padding: 14px 24px 4px;
        font-size: 13px;
        font-weight: 600;
        flex: none;
      }
      .view {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;
      }
      .view::-webkit-scrollbar {
        display: none;
      }

      /* Header */
      .head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 8px 20px 4px;
        gap: 12px;
      }
      .head h1 {
        font-size: 27px;
      }
      .head .sub {
        font-size: 12.5px;
        color: var(--text-2);
        font-weight: 600;
        margin-bottom: 3px;
      }
      .icobtn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--surface);
        display: grid;
        place-items: center;
        flex: none;
      }
      .icobtn svg {
        width: 20px;
        height: 20px;
        stroke: var(--text);
        fill: none;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Continue card */
      .cont {
        margin: 14px 20px 0;
        background: var(--surface);
        border-radius: var(--r-lg);
        overflow: hidden;
        width: calc(100% - 40px);
      }
      .cont .top {
        padding: 16px 17px 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .cont .course {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-2);
        margin-bottom: 7px;
        display: block;
      }
      .cont h2 {
        font-size: 21px;
        margin-bottom: 6px;
        letter-spacing: -0.02em;
      }
      .cont .meta {
        font-size: 13px;
        color: var(--text-2);
      }
      .cont .pacetag {
        font-size: 11px;
        font-weight: 700;
        border-radius: var(--r-full);
        padding: 5px 10px;
        flex: none;
      }
      .cont .go {
        padding: 14px 17px 17px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .progline {
        height: 5px;
        background: var(--surface-2);
        margin: 14px 17px 0;
        border-radius: 3px;
        overflow: hidden;
      }
      .progline i {
        display: block;
        height: 100%;
        background: var(--green);
        border-radius: 3px;
      }
      .proglab {
        padding: 7px 17px 0;
        font-size: 11.5px;
        color: var(--text-2);
        font-weight: 600;
        display: flex;
        justify-content: space-between;
      }

      .btn {
        background: var(--green);
        color: #06221a;
        font-weight: 700;
        font-size: 15px;
        padding: 13px 20px;
        border-radius: var(--r-full);
        min-height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        flex: 1;
        text-align: center;
      }
      .btn.ghost {
        background: var(--surface-2);
        color: var(--text);
        flex: 0 0 auto;
        padding: 13px 17px;
      }
      .btn.wide {
        width: 100%;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn .r {
        margin-left: auto;
        opacity: 0.75;
        font-weight: 600;
        font-size: 13.5px;
      }

      /* Time fit */
      .fit {
        padding: 20px 0 0;
      }
      .fit .lab {
        padding: 0 20px 8px;
        font-size: 12px;
        color: var(--text-2);
        font-weight: 700;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 0 20px 4px;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        flex: none;
        border: 1px solid var(--line);
        border-radius: var(--r-full);
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-2);
        background: var(--surface);
        min-height: 40px;
      }
      .chip[aria-pressed="true"] {
        background: var(--text);
        color: var(--base);
        border-color: var(--text);
      }

      /* Sections */
      .sec {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 24px 20px 10px;
      }
      .sec h2 {
        font-size: 18px;
      }
      .sec span,
      .sec button {
        font-size: 12.5px;
        color: var(--text-2);
        font-weight: 600;
      }
      .sec button {
        color: var(--green);
      }

      /* Lesson row */
      .lrow {
        display: flex;
        gap: 13px;
        align-items: center;
        padding: 12px 20px;
        width: 100%;
        border-top: 1px solid var(--line);
      }
      .lrow .st {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1.5px solid var(--line);
        flex: none;
        display: grid;
        place-items: center;
      }
      .lrow .st[data-done="true"] {
        background: var(--green);
        border-color: var(--green);
      }
      .lrow .st[data-done="true"]::after {
        content: "";
        width: 9px;
        height: 5px;
        border-left: 2px solid #06221a;
        border-bottom: 2px solid #06221a;
        transform: rotate(-45deg) translate(1px, -2px);
      }
      .lrow .st[data-now="true"] {
        border-color: var(--green);
        border-width: 5px;
      }
      .lrow .t {
        flex: 1;
        min-width: 0;
      }
      .lrow b {
        font-size: 14.5px;
        font-weight: 600;
        display: block;
        margin-bottom: 2px;
        line-height: 1.3;
      }
      .lrow span {
        font-size: 12px;
        color: var(--text-2);
      }
      .lrow .min {
        font-size: 12.5px;
        color: var(--text-2);
        font-weight: 600;
        flex: none;
      }

      /* Course card */
      .crail {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 0 20px 4px;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .crail::-webkit-scrollbar {
        display: none;
      }
      .ccard {
        flex: none;
        width: 172px;
        scroll-snap-align: start;
      }
      .ccard .art {
        width: 172px;
        height: 108px;
        border-radius: var(--r-md);
        overflow: hidden;
        margin-bottom: 9px;
      }
      .ccard .cat {
        font-size: 10.5px;
        font-weight: 700;
        color: var(--green);
        letter-spacing: 0.04em;
        display: block;
        margin-bottom: 3px;
      }
      .ccard b {
        display: block;
        font-size: 14.5px;
        font-weight: 700;
        line-height: 1.25;
        margin-bottom: 3px;
      }
      .ccard span {
        font-size: 12px;
        color: var(--text-2);
        display: block;
      }

      .clist {
        display: flex;
        gap: 13px;
        align-items: center;
        padding: 12px 20px;
        width: 100%;
      }
      .clist .art {
        width: 76px;
        height: 76px;
        border-radius: var(--r-md);
        overflow: hidden;
        flex: none;
      }
      .clist .t {
        flex: 1;
        min-width: 0;
      }
      .clist b {
        font-size: 15.5px;
        font-weight: 700;
        display: block;
        margin-bottom: 3px;
        line-height: 1.25;
      }
      .clist span {
        font-size: 12.5px;
        color: var(--text-2);
        display: block;
      }

      /* Enrolled row with pace */
      .enrolled {
        margin: 0 20px 10px;
        background: var(--surface);
        border-radius: var(--r-md);
        padding: 14px;
        width: calc(100% - 40px);
      }
      .enrolled .r1 {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 11px;
      }
      .enrolled .art {
        width: 46px;
        height: 46px;
        border-radius: var(--r-sm);
        overflow: hidden;
        flex: none;
      }
      .enrolled b {
        font-size: 15px;
        font-weight: 700;
        display: block;
        line-height: 1.25;
        margin-bottom: 3px;
      }
      .enrolled .sub {
        font-size: 12px;
        color: var(--text-2);
      }
      .bar {
        height: 5px;
        background: var(--surface-2);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 7px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 3px;
        background: var(--green);
      }
      .enrolled .foot {
        display: flex;
        justify-content: space-between;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--text-2);
      }

      /* Course detail */
      .hero {
        height: 210px;
        overflow: hidden;
        position: relative;
      }
      .topbar {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        z-index: 2;
      }
      .rnd {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(14, 23, 25, 0.85);
        display: grid;
